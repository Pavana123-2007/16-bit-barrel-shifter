<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold">16-bit barrel shifter: barrel_shifter16 (complete circuit)</text>

  <!-- MODE decode -->
  <rect x="40" y="50" width="250" height="70" fill="#fff4d6" stroke="#333"/>
  <text x="165" y="72" text-anchor="middle" font-weight="bold">MODE decode</text>
  <text x="165" y="92" text-anchor="middle">right = M1 xor M0     rot = M1 and M0</text>
  <text x="165" y="110" text-anchor="middle">fill = M1 and (not M0) and DIN[15]</text>
  <text x="25" y="88" text-anchor="end">MODE[1:0]</text>
  <line x1="28" y1="85" x2="40" y2="85" stroke="#333" marker-end="url(#a)"/>

  <!-- control bus -->
  <line x1="290" y1="85" x2="800" y2="85" stroke="#b33" stroke-width="2"/>
  <text x="545" y="78" text-anchor="middle" fill="#b33">right, rot, fill (shared by all 4 stages)</text>
  <line x1="165" y1="120" x2="165" y2="100" stroke="#333"/>

  <!-- stages -->
  <g stroke="#333" fill="#dbe9ff">
    <rect x="70"  y="170" width="150" height="90"/>
    <rect x="270" y="170" width="150" height="90"/>
    <rect x="470" y="170" width="150" height="90"/>
    <rect x="670" y="170" width="150" height="90"/>
  </g>
  <g text-anchor="middle">
    <text x="145" y="200" font-weight="bold">Stage 1 (x1)</text>
    <text x="145" y="220">shift_stage_mode</text>
    <text x="145" y="240">16 x 2:1 MUX</text>
    <text x="345" y="200" font-weight="bold">Stage 2 (x2)</text>
    <text x="345" y="220">shift_stage_mode</text>
    <text x="345" y="240">16 x 2:1 MUX</text>
    <text x="545" y="200" font-weight="bold">Stage 3 (x4)</text>
    <text x="545" y="220">shift_stage_mode</text>
    <text x="545" y="240">16 x 2:1 MUX</text>
    <text x="745" y="200" font-weight="bold">Stage 4 (x8)</text>
    <text x="745" y="220">shift_stage_mode</text>
    <text x="745" y="240">16 x 2:1 MUX</text>
  </g>

  <!-- control taps -->
  <g stroke="#b33" stroke-width="1.5" marker-end="url(#a)">
    <line x1="145" y1="85" x2="145" y2="168"/>
    <line x1="345" y1="85" x2="345" y2="168"/>
    <line x1="545" y1="85" x2="545" y2="168"/>
    <line x1="745" y1="85" x2="745" y2="168"/>
  </g>

  <!-- data path -->
  <g stroke="#333" stroke-width="2" marker-end="url(#a)">
    <line x1="30"  y1="215" x2="68"  y2="215"/>
    <line x1="220" y1="215" x2="268" y2="215"/>
    <line x1="420" y1="215" x2="468" y2="215"/>
    <line x1="620" y1="215" x2="668" y2="215"/>
    <line x1="820" y1="215" x2="868" y2="215"/>
  </g>
  <text x="30" y="205">DIN[15:0]</text>
  <text x="244" y="207" text-anchor="middle">s1</text>
  <text x="444" y="207" text-anchor="middle">s2</text>
  <text x="644" y="207" text-anchor="middle">s3</text>
  <text x="868" y="205" text-anchor="end">DOUT[15:0]</text>

  <!-- SHAMT selects -->
  <g stroke="#2a7" stroke-width="1.5" marker-end="url(#a)">
    <line x1="145" y1="320" x2="145" y2="262"/>
    <line x1="345" y1="320" x2="345" y2="262"/>
    <line x1="545" y1="320" x2="545" y2="262"/>
    <line x1="745" y1="320" x2="745" y2="262"/>
  </g>
  <g text-anchor="middle" fill="#2a7">
    <text x="145" y="338">SHAMT[0]</text>
    <text x="345" y="338">SHAMT[1]</text>
    <text x="545" y="338">SHAMT[2]</text>
    <text x="745" y="338">SHAMT[3]</text>
  </g>

  <!-- DIN[15] to fill -->
  <path d="M 40 215 L 40 150 L 120 150 L 120 130 L 165 130 L 165 120" fill="none" stroke="#333" stroke-dasharray="4 3"/>
  <text x="50" y="146" font-size="11">DIN[15] (sign bit)</text>
</svg>
